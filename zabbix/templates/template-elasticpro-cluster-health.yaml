# Zabbix 7.0 template: cluster health and per-node alerts for one Elasticsearch cluster.
#
# The ElasticPro-owned replacement for the customer-era copy of Zabbix's "Elasticsearch
# Cluster by HTTP": the same item, discovery rule and prototype keys, value types and trigger
# expressions, so tools/migrate-templates.py can unlink an older template (without clear) and
# this one adopts every host item with its history (docs/MIGRATION.md). Capacity and volume
# figures (role.*, es.volume.*), ILM/SLM status and the dashboard of the old template are not
# here: ElasticPro's own templates carry those, and the old items stay on the host as host
# items when it is unlinked.
#
# Connection macros ({$ELASTICSEARCH.SCHEME/HOST/PORT}) are declared by the always-linked
# "Elasticsearch Cluster by HTTP EP" template; the credentials ({$ELASTICSEARCH.USERNAME/
# PASSWORD}) by the host or ElasticPro's default credential (global macros). Declaring them
# here would shadow both, so the validator's "used but not defined" warnings for those five
# macros are expected. See README.md next to this file.
zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: a4d66365396d4f7fb44b205013911a63
      name: Templates/Applications
  templates:
    - uuid: 5161fa9c4fcd406baf16b6afc9233810
      template: ElasticPro cluster health
      name: ElasticPro cluster health
      description: |
        Cluster health, service, node count, shard and per-node (JVM heap, latency, thread-pool rejections, restarts) items and alerts for one Elasticsearch cluster, asked over HTTP by the Zabbix server or proxy.

        The stock-core subset of Zabbix's "Elasticsearch Cluster by HTTP" (four HTTP masters, two simple checks, their dependents, the nodes discovery with its 46 prototypes and the stock triggers) under the SAME item, discovery and prototype keys, so a host moved here from an older Elasticsearch template keeps every stored value: tools/migrate-templates.py unlinks the old template without clear and this one adopts the items (docs/MIGRATION.md). Plus the daily indices-size check es.indices-check (yesterday's logstash-* indices, summed) with its {$INDICES.MAX.SIZE} / {$INDICES.MIN.SIZE} triggers and 3d/7d/30d averages.

        Connection and credentials are deliberately not declared here. {$ELASTICSEARCH.SCHEME}, {$ELASTICSEARCH.HOST} and {$ELASTICSEARCH.PORT} belong to the always-linked "Elasticsearch Cluster by HTTP EP" template and are set on the host by Cluster Management. {$ELASTICSEARCH.USERNAME} and {$ELASTICSEARCH.PASSWORD} come from the host, or from ElasticPro's default credential (global macros): a template that defined the password macro would hide that default for every cluster it is linked to. Thresholds are the {$ELASTICSEARCH.*.MAX.*} macros below.

        Written in the ElasticPro Zabbix modules repository (zabbix/templates). Zabbix 7.0.
      vendor:
        name: ElasticPro
        version: 7.0-1
      groups:
        - name: Templates/Applications
      items:
        - uuid: f5989b26932e4a88af5af44c427d65cd
          name: Delayed unassigned shards
          type: DEPENDENT
          key: es.cluster.delayed_unassigned_shards
          delay: '0'
          description: The number of shards whose allocation has been delayed by the timeout settings.
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.delayed_unassigned_shards
          master_item:
            key: es.cluster.get_health
          tags:
            - tag: component
              value: shards
        - uuid: 274f1e3fd05e44448d4a209c422ecb25
          name: Get cluster health
          type: HTTP_AGENT
          key: es.cluster.get_health
          delay: 2m
          history: '0'
          value_type: TEXT
          trends: '0'
          authtype: BASIC
          username: '{$ELASTICSEARCH.USERNAME}'
          password: '{$ELASTICSEARCH.PASSWORD}'
          description: Returns the health status of a cluster.
          timeout: 15s
          url: '{$ELASTICSEARCH.SCHEME}://{$ELASTICSEARCH.HOST}:{$ELASTICSEARCH.PORT}/_cluster/health?timeout=5s'
          tags:
            - tag: component
              value: raw
        - uuid: 485c4935206c4c53aab8e75cc49553a5
          name: Get cluster stats
          type: HTTP_AGENT
          key: es.cluster.get_stats
          delay: 3m
          history: '0'
          value_type: TEXT
          trends: '0'
          authtype: BASIC
          username: '{$ELASTICSEARCH.USERNAME}'
          password: '{$ELASTICSEARCH.PASSWORD}'
          description: Returns cluster statistics.
          timeout: 15s
          url: '{$ELASTICSEARCH.SCHEME}://{$ELASTICSEARCH.HOST}:{$ELASTICSEARCH.PORT}/_cluster/stats'
          tags:
            - tag: component
              value: raw
        - uuid: 77f96597b2884ceda3670e962435d90f
          name: Get cluster stats-http
          type: HTTP_AGENT
          key: es.cluster.get_stats_http
          delay: 2m
          history: '0'
          value_type: TEXT
          trends: '0'
          authtype: BASIC
          username: '{$ELASTICSEARCH.USERNAME}'
          password: '{$ELASTICSEARCH.PASSWORD}'
          description: Returns cluster statistics (a second, more frequent poll of _cluster/stats; nothing depends on it). Kept under its key so a host moved from the older template keeps the item. The older template's URL carried the query string in front of the path, which asked for the root document instead.
          timeout: 15s
          url: '{$ELASTICSEARCH.SCHEME}://{$ELASTICSEARCH.HOST}:{$ELASTICSEARCH.PORT}/_cluster/stats'
          tags:
            - tag: component
              value: raw
        - uuid: a452080979cc4f4ba7f554227a0376bb
          name: Inactive shards percentage
          type: DEPENDENT
          key: es.cluster.inactive_shards_percent_as_number
          delay: '0'
          value_type: FLOAT
          units: '%'
          description: The ratio of inactive shards in the cluster expressed as a percentage.
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.active_shards_percent_as_number
            - type: JAVASCRIPT
              parameters:
                - return (100 - value)
          master_item:
            key: es.cluster.get_health
          tags:
            - tag: component
              value: shards
        - uuid: c23a8f3034ba4b9dbba0f5e8b14acf67
          name: Number of initializing shards
          type: DEPENDENT
          key: es.cluster.initializing_shards
          delay: '0'
          description: The number of shards that are under initialization.
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.initializing_shards
          master_item:
            key: es.cluster.get_health
          tags:
            - tag: component
              value: shards
          triggers:
            - uuid: 83e021b729b143718ba451e3b6b333de
              expression: min(/ElasticPro cluster health/es.cluster.initializing_shards,15m)>0
              name: 'Elasticsearch: Cluster has the initializing shards'
              priority: WARNING
              description: The cluster has the initializing shards longer than 10 minutes.
              tags:
                - tag: scope
                  value: notice
        - uuid: 2fcb0ef4b295465da8fec18d4d90d75c
          name: Number of data nodes
          type: DEPENDENT
          key: es.cluster.number_of_data_nodes
          delay: '0'
          description: The number of nodes that are dedicated to data nodes.
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.number_of_data_nodes
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: es.cluster.get_health
          tags:
            - tag: component
              value: nodes
        - uuid: 5103397e079941e1af640933a72afc1e
          name: Number of nodes
          type: DEPENDENT
          key: es.cluster.number_of_nodes
          delay: '0'
          description: The number of nodes within the cluster.
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.number_of_nodes
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: es.cluster.get_health
          tags:
            - tag: component
              value: nodes
          triggers:
            - uuid: 33fa3e9a09bf4f9eb84956239ec697d6
              expression: change(/ElasticPro cluster health/es.cluster.number_of_nodes)<0
              name: 'Elasticsearch: The number of nodes within the cluster has decreased'
              priority: HIGH
              manual_close: 'YES'
              tags:
                - tag: component
                  value: elasticsearch
                - tag: scope
                  value: notice
            - uuid: 9b763deb5e6943b7b060f60c8ede246b
              expression: change(/ElasticPro cluster health/es.cluster.number_of_nodes)>0
              name: 'Elasticsearch: The number of nodes within the cluster has increased'
              priority: HIGH
              manual_close: 'YES'
              tags:
                - tag: component
                  value: elasticsearch
                - tag: scope
                  value: notice
        - uuid: e3a78b88a2cc4da787ee2b744b6ae471
          name: Number of pending tasks
          type: DEPENDENT
          key: es.cluster.number_of_pending_tasks
          delay: '0'
          description: The number of cluster-level changes that have not yet been executed.
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.number_of_pending_tasks
          master_item:
            key: es.cluster.get_health
          tags:
            - tag: component
              value: tasks
        - uuid: 887f311e6b964620af734aabb1a917cf
          name: Number of relocating shards
          type: DEPENDENT
          key: es.cluster.relocating_shards
          delay: '0'
          description: The number of shards that are under relocation.
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.relocating_shards
          master_item:
            key: es.cluster.get_health
          tags:
            - tag: component
              value: shards
        - uuid: 2ad059e6a79f4147a7cae51caed3cc99
          name: Cluster health status
          type: DEPENDENT
          key: es.cluster.status
          delay: '0'
          description: |
            Health status of the cluster, based on the state of its primary and replica shards. Statuses are:
            green
            All shards are assigned.
            yellow
            All primary shards are assigned, but one or more replica shards are unassigned. If a node in the cluster fails, some data could be unavailable until that node is repaired.
            red
            One or more primary shards are unassigned, so some data is unavailable. This can occur briefly during cluster startup as primary shards are assigned.
          valuemap:
            name: ES cluster state
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.status
            - type: JAVASCRIPT
              parameters:
                - |
                  var state = ['green', 'yellow', 'red'];

                  return state.indexOf(value.trim()) === -1 ? 255 : state.indexOf(value.trim());
          master_item:
            key: es.cluster.get_health
          tags:
            - tag: component
              value: health
          triggers:
            - uuid: 65aea85782b949708dc48097c3435dfa
              expression: last(/ElasticPro cluster health/es.cluster.status,#5)=2
              name: 'Elasticsearch: Health is RED on {HOST.NAME}'
              priority: DISASTER
              description: |
                One or more primary shards are unassigned, so some data is unavailable.
                This can occur briefly during cluster startup as primary shards are assigned.
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: availability
            - uuid: 0f4a594ca4534fee82b3b81155542a0c
              expression: last(/ElasticPro cluster health/es.cluster.status)=255
              name: 'Elasticsearch: Health is UNKNOWN'
              priority: HIGH
              description: The health status of the cluster is unknown or cannot be obtained.
              tags:
                - tag: component
                  value: elasticsearch
                - tag: scope
                  value: availability
            - uuid: 1c34b97238ff43468a1d035105ea3165
              expression: last(/ElasticPro cluster health/es.cluster.status)=1
              name: 'Elasticsearch: Health is YELLOW'
              status: DISABLED
              priority: INFO
              description: |
                All primary shards are assigned, but one or more replica shards are unassigned.
                If a node in the cluster fails, some data could be unavailable until that node is repaired.
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: availability
        - uuid: cde54cb0e2dd4924b7983b80ba3ace75
          name: Task max waiting in queue
          type: DEPENDENT
          key: es.cluster.task_max_waiting_in_queue
          delay: '0'
          value_type: FLOAT
          units: s
          description: The time expressed in seconds since the earliest initiated task is waiting for being performed.
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.task_max_waiting_in_queue_millis
            - type: MULTIPLIER
              parameters:
                - '0.001'
          master_item:
            key: es.cluster.get_health
          tags:
            - tag: component
              value: tasks
        - uuid: acbf4e1d1d18404383dea0edb5ee38fd
          name: Number of unassigned shards
          type: DEPENDENT
          key: es.cluster.unassigned_shards
          delay: '0'
          description: The number of shards that are not allocated.
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.unassigned_shards
          master_item:
            key: es.cluster.get_health
          tags:
            - tag: component
              value: shards
          triggers:
            - uuid: bcab8996f3064e138540527bed38b660
              expression: min(/ElasticPro cluster health/es.cluster.unassigned_shards,30m)>0
              name: 'Elasticsearch: Cluster has the unassigned shards'
              priority: INFO
              description: The cluster has the unassigned shards longer than 10 minutes.
              tags:
                - tag: scope
                  value: notice
        - uuid: 22c920b9e24c429a8a6ed6e700b7913f
          name: ES indices size
          type: HTTP_AGENT
          key: es.indices-check
          delay: 0;wd1-7h1
          units: B
          authtype: BASIC
          username: '{$ELASTICSEARCH.USERNAME}'
          password: '{$ELASTICSEARCH.PASSWORD}'
          description: wd1-7h0-1
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  try {
                      var lines = value.trim().split('\n');

                      // calculate yesterday (YYYY.MM.DD)
                      var d = new Date();
                      d.setDate(d.getDate() - 1);

                      var yyyy = d.getFullYear();
                      var mm = ('0' + (d.getMonth() + 1)).slice(-2);
                      var dd = ('0' + d.getDate()).slice(-2);

                      var yesterday = yyyy + '.' + mm + '.' + dd;

                      var sum = 0;

                      lines.forEach(function(line) {
                          var parts = line.trim().split(/\s+/);
                          var indexName = parts[0];
                          var sizeBytes = parseInt(parts[1], 10);

                          if (indexName.endsWith('-' + yesterday)) {
                              sum += sizeBytes;
                          }
                      });

                      return sum;

                  } catch (e) {
                      return 0;
                  }
          timeout: 20s
          url: '{$ELASTICSEARCH.SCHEME}://{$ELASTICSEARCH.HOST}:{$ELASTICSEARCH.PORT}/_cat/indices?v&index=logstash*&h=index,pri.store.size&bytes=b'
          triggers:
            - uuid: aae4b92b8da84def8e9a0a8779ea204c
              expression: last(/ElasticPro cluster health/es.indices-check)/(1073741824)>{$INDICES.MAX.SIZE}
              recovery_mode: NONE
              name: '{HOST.HOST} ES Indices size above than avg [Daily Max Avg: {$INDICES.MAX.SIZE} GB]'
              event_name: 'ES Indices size above than avg [Daily Max Avg: {$INDICES.MAX.SIZE} GB]'
              opdata: 'Yesterday: {ITEM.LASTVALUE} ,Max Avg: {$INDICES.MAX.SIZE} GB'
              priority: AVERAGE
              description: |
                Indices are above/below than daily average. Please take action.
                Yesterday: {ITEM.LASTVALUE},
                Avg (Max): {$INDICES.MAX.SIZE} G,
                Avg (Min): {$INDICES.MIN.SIZE} G
              manual_close: 'YES'
              tags:
                - tag: component
                  value: indices-avg
            - uuid: 6a637914adc84108ab54a2fb0a82392c
              expression: last(/ElasticPro cluster health/es.indices-check)/(1073741824)<{$INDICES.MIN.SIZE}
              recovery_mode: NONE
              name: '{HOST.HOST} ES Indices size lower > [Daily Min Avg: {$INDICES.MIN.SIZE} GB]'
              event_name: 'ES Indices size lower > [Daily Min Avg: {$INDICES.MIN.SIZE} GB]'
              opdata: 'Yesterday: {ITEM.LASTVALUE} ,Min Avg: {$INDICES.MIN.SIZE} GB,'
              priority: AVERAGE
              description: |
                Indices are above/below than daily average. Please take action.
                Yesterday: {ITEM.LASTVALUE},
                Avg (Max): {$INDICES.MAX.SIZE} G,
                Avg (Min): {$INDICES.MIN.SIZE} G
              manual_close: 'YES'
              tags:
                - tag: type
                  value: indices-avg
        - uuid: b6b7b29c151948e290f4e111b74c4e75
          name: ES indices 3d avg size
          type: CALCULATED
          key: es.indices.avg.3d
          delay: 1h
          units: B
          params: avg(//es.indices-check,3d)
        - uuid: b36dc79c84f74f3895e1647ce849d8ba
          name: ES indices 7d avg size
          type: CALCULATED
          key: es.indices.avg.7d
          delay: 1h
          units: B
          params: avg(//es.indices-check,7d)
        - uuid: 99f6f297411d4c9a8a205644a5e37d86
          name: ES indices 30d avg size
          type: CALCULATED
          key: es.indices.avg.30d
          delay: 1h
          units: B
          params: avg(//es.indices-check,30d)
        - uuid: 1823ae8c1bc04e5cae5076ce52ac1d9a
          name: Indices with shards assigned to nodes
          type: DEPENDENT
          key: es.indices.count
          delay: '0'
          description: The total number of indices with shards assigned to the selected nodes.
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.indices.count
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: es.cluster.get_stats
          tags:
            - tag: component
              value: indices
        - uuid: c16c7abafbc340a8b523e4969192bfd5
          name: Number of non-deleted documents
          type: DEPENDENT
          key: es.indices.docs.count
          delay: '0'
          description: |
            The total number of non-deleted documents across all primary shards assigned to the selected nodes.
            This number is based on the documents in Lucene segments and may include the documents from nested fields.
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.indices.docs.count
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: es.cluster.get_stats
          tags:
            - tag: component
              value: documents
        - uuid: 4ca7ce88e5604854bf3fd4dfbe79d916
          name: ES indices 30d sum size
          type: CALCULATED
          key: es.indices.sum.30d
          delay: 1h
          units: B
          params: sum(//es.indices-check,30d)
        - uuid: 99dc13f67a8342758105f92274af994e
          name: ES JDK version
          type: DEPENDENT
          key: es.jdk.version
          delay: '0'
          value_type: CHAR
          trends: '0'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.nodes.jvm.versions[0].version
          master_item:
            key: es.cluster.get_stats
          tags:
            - tag: type
              value: es_jdk_version
        - uuid: a22c116f4ad348a791a8b894a6b71714
          name: Nodes with the data role
          type: DEPENDENT
          key: es.nodes.count.data
          delay: '0'
          description: The number of selected nodes with the data role.
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.nodes.count.data
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: es.cluster.get_stats
          tags:
            - tag: component
              value: nodes
        - uuid: bcc97a3f2c5d4bee905b9967e362930d
          name: Nodes with the ingest role
          type: DEPENDENT
          key: es.nodes.count.ingest
          delay: '0'
          description: The number of selected nodes with the ingest role.
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.nodes.count.ingest
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: es.cluster.get_stats
          tags:
            - tag: component
              value: nodes
        - uuid: c3d1fb73f5904780bc079c7acd68c8f8
          name: Nodes with the master role
          type: DEPENDENT
          key: es.nodes.count.master
          delay: '0'
          description: The number of selected nodes with the master role.
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.nodes.count.master
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: es.cluster.get_stats
          tags:
            - tag: component
              value: nodes
          triggers:
            - uuid: ed66dc75008d4503a2a9f2e820a1d74d
              expression: last(/ElasticPro cluster health/es.nodes.count.master)=1
              name: 'Elasticsearch: Cluster has only two master nodes'
              status: DISABLED
              priority: INFO
              description: The cluster has only two nodes with a master role and will be unavailable if one of them breaks.
              tags:
                - tag: scope
                  value: notice
        - uuid: 511656c2f22946e5bb72b7e52b569f9f
          name: 'ES Data nodes: Avail Size'
          type: DEPENDENT
          key: es.nodes.data.fas.avail-size
          delay: '0'
          trends: '0'
          units: B
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var d = JSON.parse(value).nodes, t = 0;
                  Object.keys(d).forEach(function (k) {
                      var n = d[k], r = n.roles || [], hit = false;
                      for (var i = 0; i < r.length; i++)
                          if (r[i] === 'data' || r[i].indexOf('data_') === 0) { hit = true; break; }
                      if (hit && n.fs && n.fs.total) t += n.fs.total.available_in_bytes;
                  });
                  return t;
          master_item:
            key: es.nodes.get_stats
        - uuid: f360cd1953b04a149418072addc68f42
          name: 'ES Data nodes: Total Size'
          type: DEPENDENT
          key: es.nodes.data.fas.total-size
          delay: '0'
          trends: '0'
          units: B
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var d = JSON.parse(value).nodes, t = 0;
                  Object.keys(d).forEach(function (k) {
                      var n = d[k], r = n.roles || [], hit = false;
                      for (var i = 0; i < r.length; i++)
                          if (r[i] === 'data' || r[i].indexOf('data_') === 0) { hit = true; break; }
                      if (hit && n.fs && n.fs.total) t += n.fs.total.total_in_bytes;
                  });
                  return t;
          master_item:
            key: es.nodes.get_stats
        - uuid: e826e5f69a604b60bbf08943ef7c1a6a
          name: 'ES Data nodes: Used % Size'
          type: CALCULATED
          key: es.nodes.data.fs.used
          units: '%'
          params: (last(//es.nodes.data.fas.total-size)-last(//es.nodes.data.fas.avail-size))/last(//es.nodes.data.fas.total-size)*100
          tags:
            - tag: elasticsearch
              value: pused
        - uuid: f54ed951437241cf8d359894e4d4af5b
          name: Total ES available size to JVM in all file stores
          type: DEPENDENT
          key: es.nodes.fs.available_in_bytes
          delay: '0'
          units: B
          description: |
            The total number of bytes available to JVM in the file stores across all selected nodes.
            Depending on OS or process-level restrictions, this number may be less than nodes.fs.free_in_byes.
            This is the actual amount of free disk space the selected Elasticsearch nodes can use.
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.nodes.fs.available_in_bytes
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: es.cluster.get_stats
          tags:
            - tag: component
              value: storage
        - uuid: 97e1d96278f14884bf3ceea64d0a7df0
          name: Total ES pused size of all file stores
          type: CALCULATED
          key: es.nodes.fs.pused_in_bytes
          delay: 2m
          value_type: FLOAT
          units: '%'
          params: (last(//es.nodes.fs.total_in_bytes) - last(//es.nodes.fs.available_in_bytes)) / last(//es.nodes.fs.total_in_bytes) * 100
        - uuid: de539ab88b254dd085a40a2a13a18a28
          name: Total ES size of all file stores
          type: DEPENDENT
          key: es.nodes.fs.total_in_bytes
          delay: '0'
          units: B
          description: The total size in bytes of all file stores across all selected nodes.
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.nodes.fs.total_in_bytes
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: es.cluster.get_stats
          tags:
            - tag: component
              value: storage
        - uuid: 7320fa39622c44058f6ae7d54de7a79c
          name: Total ES Used size of all file stores
          type: CALCULATED
          key: es.nodes.fs.used_in_bytes
          delay: 2m
          units: B
          params: last(//es.nodes.fs.total_in_bytes) - last(//es.nodes.fs.available_in_bytes)
        - uuid: 302c569bc4cf4d72b5800654bba94f81
          name: Get nodes stats
          type: HTTP_AGENT
          key: es.nodes.get_stats
          delay: 3m
          history: '0'
          value_type: TEXT
          trends: '0'
          authtype: BASIC
          username: '{$ELASTICSEARCH.USERNAME}'
          password: '{$ELASTICSEARCH.PASSWORD}'
          description: Returns cluster nodes statistics.
          timeout: 30s
          url: '{$ELASTICSEARCH.SCHEME}://{$ELASTICSEARCH.HOST}:{$ELASTICSEARCH.PORT}/_nodes/stats'
          tags:
            - tag: component
              value: raw
        - uuid: c81281fa4d444c08ab47a25f218da2e7
          name: 'ES Data nodes: IP list'
          type: DEPENDENT
          key: es.nodes.ip.data
          delay: '0'
          value_type: TEXT
          trends: '0'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var d = JSON.parse(value).nodes, out = [];
                  Object.keys(d).forEach(function (k) {
                      var n = d[k], r = n.roles || [], hit = false;
                      for (var i = 0; i < r.length; i++)
                          if (r[i] === 'data' || r[i].indexOf('data_') === 0) { hit = true; break; }
                      if (hit) out.push(n.ip || n.host || n.name);
                  });
                  return out.sort().join(', ');
          master_item:
            key: es.nodes.get_stats
        - uuid: 113a7cda6fd44e199d5a811095812bb2
          name: 'ES Ingest nodes: IP list'
          type: DEPENDENT
          key: es.nodes.ip.ingest
          delay: '0'
          value_type: TEXT
          trends: '0'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var d = JSON.parse(value).nodes, out = [];
                  Object.keys(d).forEach(function (k) {
                      var n = d[k], r = n.roles || [];
                      if (r.indexOf('ingest') !== -1) out.push(n.ip || n.host || n.name);
                  });
                  return out.sort().join(', ');
          master_item:
            key: es.nodes.get_stats
        - uuid: ea280515feae45ff8115de8c924b8dfe
          name: 'ES Master nodes: IP list'
          type: DEPENDENT
          key: es.nodes.ip.master
          delay: '0'
          value_type: TEXT
          trends: '0'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var d = JSON.parse(value).nodes, out = [];
                  Object.keys(d).forEach(function (k) {
                      var n = d[k], r = n.roles || [];
                      if (r.indexOf('master') !== -1) out.push(n.ip || n.host || n.name);
                  });
                  return out.sort().join(', ');
          master_item:
            key: es.nodes.get_stats
        - uuid: 8a3afd35ae6e432fab268d82b7235a30
          name: Cluster uptime
          type: DEPENDENT
          key: es.nodes.jvm.max_uptime
          delay: '0'
          value_type: FLOAT
          units: s
          description: Uptime duration in seconds since JVM has last started.
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.nodes.jvm.max_uptime_in_millis
            - type: MULTIPLIER
              parameters:
                - '0.001'
          master_item:
            key: es.cluster.get_stats
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: d8bb627a6d4c4e6b87fd83a46b907a71
              expression: last(/ElasticPro cluster health/es.nodes.jvm.max_uptime)<5m
              name: 'Elasticsearch: Cluster has been restarted'
              event_name: 'Elasticsearch: Cluster has been restarted (uptime < 10m)'
              priority: AVERAGE
              description: Uptime is less than 10 minutes.
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: notice
        - uuid: fc2586ce37984d9b8bc8a865b6d35c38
          name: ES version
          type: DEPENDENT
          key: es.version
          delay: '0'
          value_type: CHAR
          trends: '0'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.nodes.versions[0]
          master_item:
            key: es.cluster.get_stats
          tags:
            - tag: type
              value: es_version
        - uuid: 61b8efb1d20b4bc8b706e0627b215952
          name: Service response time
          type: SIMPLE
          key: net.tcp.service.perf["{$ELASTICSEARCH.SCHEME}","{$ELASTICSEARCH.HOST}","{$ELASTICSEARCH.PORT}"]
          value_type: FLOAT
          units: s
          description: Checks performance of the TCP service.
          tags:
            - tag: component
              value: network
          triggers:
            - uuid: 00e001eb861d4d8aac9e6862c68ecf82
              expression: min(/ElasticPro cluster health/net.tcp.service.perf["{$ELASTICSEARCH.SCHEME}","{$ELASTICSEARCH.HOST}","{$ELASTICSEARCH.PORT}"],5m)>{$ELASTICSEARCH.RESPONSE_TIME.MAX.WARN}
              name: 'Elasticsearch: Service response time is too high'
              event_name: 'Elasticsearch: Service response time is too high (over {$ELASTICSEARCH.RESPONSE_TIME.MAX.WARN} for 5m)'
              priority: WARNING
              description: The performance of the TCP service is very low.
              manual_close: 'YES'
              dependencies:
                - name: 'Elasticsearch: Service is down on {HOST.NAME}'
                  expression: last(/ElasticPro cluster health/net.tcp.service["{$ELASTICSEARCH.SCHEME}","{$ELASTICSEARCH.HOST}","{$ELASTICSEARCH.PORT}"],#3)<>1
              tags:
                - tag: scope
                  value: performance
        - uuid: 0a89bb05222a4fd78ccf78405e213725
          name: Service status
          type: SIMPLE
          key: net.tcp.service["{$ELASTICSEARCH.SCHEME}","{$ELASTICSEARCH.HOST}","{$ELASTICSEARCH.PORT}"]
          description: Checks if the service is running and accepting TCP connections.
          valuemap:
            name: Service state
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 10m
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
          triggers:
            - uuid: fc5cfb66770f415e895d7cca8fa764e3
              expression: last(/ElasticPro cluster health/net.tcp.service["{$ELASTICSEARCH.SCHEME}","{$ELASTICSEARCH.HOST}","{$ELASTICSEARCH.PORT}"],#3)<>1
              name: 'Elasticsearch: Service is down on {HOST.NAME}'
              event_name: 'Elasticsearch: Service is down on {HOST.HOST}'
              priority: DISASTER
              description: The service is unavailable or does not accept TCP connections.
              manual_close: 'YES'
              tags:
                - tag: component
                  value: elasticsearch
                - tag: scope
                  value: availability
                - tag: service
                  value: elasticsearch
                - tag: status
                  value: down
      discovery_rules:
        - uuid: b81b85dfe5b54b15aab82b5a2b4440c4
          name: Cluster nodes discovery
          type: HTTP_AGENT
          key: es.nodes.discovery
          delay: 1h
          authtype: BASIC
          username: '{$ELASTICSEARCH.USERNAME}'
          password: '{$ELASTICSEARCH.PASSWORD}'
          description: Discovery ES cluster nodes.
          item_prototypes:
            - uuid: 35c880e2fd2945a09630a5107d2486f5
              name: 'ES {#ES.NODE}: Total available size'
              type: DEPENDENT
              key: es.node.fs.total.available_in_bytes[{#ES.NODE}]
              delay: '0'
              units: B
              description: |
                The total number of bytes available to this Java virtual machine on all file stores.
                Depending on OS or process level restrictions, this might appear less than fs.total.free_in_bytes.
                This is the actual amount of free disk space the Elasticsearch node can utilize.
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $..fs.total.available_in_bytes.first()
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: es.node.get.data[{#ES.NODE}]
              tags:
                - tag: component
                  value: storage
                - tag: node
                  value: '{#ES.NODE}'
            - uuid: 66677b8b309442d3bdb61f91a20d37e7
              name: 'ES {#ES.NODE}: Total size'
              type: DEPENDENT
              key: es.node.fs.total.total_in_bytes[{#ES.NODE}]
              delay: '0'
              units: B
              description: Total size (in bytes) of all file stores.
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $..fs.total.total_in_bytes.first()
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              master_item:
                key: es.node.get.data[{#ES.NODE}]
              tags:
                - tag: component
                  value: storage
                - tag: node
                  value: '{#ES.NODE}'
            - uuid: 4bfa8f45389843b0af0b2a331c333182
              name: 'ES {#ES.NODE}: Get data'
              type: DEPENDENT
              key: es.node.get.data[{#ES.NODE}]
              delay: '0'
              history: '0'
              value_type: TEXT
              trends: '0'
              description: Returns cluster nodes statistics.
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $..[?(@.name=='{#ES.NODE}')].first()
              master_item:
                key: es.nodes.get_stats
              tags:
                - tag: component
                  value: raw
                - tag: node
                  value: '{#ES.NODE}'
            - uuid: 60795666213f4e1790a3e276a65b9001
              name: 'ES {#ES.NODE}: Number of open HTTP connections'
              type: DEPENDENT
              key: es.node.http.current_open[{#ES.NODE}]
              delay: '0'
              description: The number of currently open HTTP connections for the node.
              preprocessing:
                - type: JSONPATH
