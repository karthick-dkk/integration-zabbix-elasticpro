        - uuid: d23530e5a5614a9b8b2e39c297dbda10
          name: 'Request gate: Memory: answers being read, budget'
          type: DEPENDENT
          key: 'elasticpro.gate.memory[inflight.budget]'
          delay: '0'
          units: 'B'
          description: 'The most ElasticPro may hold in answers being read at once: a quarter of CORE_MEM_LIMIT.'
          preprocessing:
            - type: JSONPATH
