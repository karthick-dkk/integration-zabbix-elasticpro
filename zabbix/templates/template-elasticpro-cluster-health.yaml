            - uuid: 509acd677d494a2c916229a7d0a611f5
              name: 'ES {#ES.NODE}: Rate of index refreshes'
              type: DEPENDENT
              key: es.node.indices.refresh.rate[{#ES.NODE}]
              delay: '0'
              value_type: FLOAT
              units: rps
