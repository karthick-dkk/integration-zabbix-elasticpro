        - uuid: 954d8cad5b86433ca6b832358dd0825e
          name: 'Request gate: Memory: read cache used'
          type: DEPENDENT
          key: 'elasticpro.gate.memory[readcache.used]'
          delay: '0'
          units: 'B'
          description: 'Bytes in the short read cache.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.memory.read_cache_used_bytes'
          master_item:
