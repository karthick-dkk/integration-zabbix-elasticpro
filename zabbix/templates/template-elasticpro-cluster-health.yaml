              tags:
                - tag: component
                  value: connections
                - tag: node
                  value: '{#ES.NODE}'
            - uuid: daa824e305984ef08aab808ea9b87b11
              name: 'ES {#ES.NODE}: Rate of HTTP connections opened'
              type: DEPENDENT
              key: es.node.http.opened.rate[{#ES.NODE}]
              delay: '0'
              value_type: FLOAT
              units: rps
              description: The number of HTTP connections opened for the node per second.
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $..http.total_opened.first()
                - type: CHANGE_PER_SECOND
                  parameters:
