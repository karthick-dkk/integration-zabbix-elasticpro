              tags:
                - tag: component
                  value: operations
                - tag: node
                  value: '{#ES.NODE}'
            - uuid: f856c4afbfb94313bba46c5e9cf83c49
              name: 'ES {#ES.NODE}: Total number of indexing'
              type: DEPENDENT
              key: es.node.indices.indexing.index_total[{#ES.NODE}]
