        - uuid: dca531b48b4d4392a0c1997d2daebadc
          name: 'Request gate: Memory: container limit'
          type: DEPENDENT
          key: 'elasticpro.gate.memory[limit]'
          delay: '0'
          units: 'B'
          description: 'The container''s memory limit as the core reads it from its cgroup. No value when there is none.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.memory.limit_bytes'
              error_handler: DISCARD_VALUE
            - type: DISCARD_UNCHANGED_HEARTBEAT
