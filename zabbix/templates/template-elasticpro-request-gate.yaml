        - uuid: 740fa0595c8c4adbaa5f003dff1ec661
          name: 'Request gate: Memory: fleet cache used, %'
          type: DEPENDENT
          key: 'elasticpro.gate.memory[cache.pused]'
          delay: '0'
          value_type: FLOAT
          units: '%'
          description: 'The fleet cache''s share of its budget. Near 100% is normal on a large fleet (it evicts on-demand bodies first); background bodies being dropped is logged by the core.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.memory.cache_pused'
              error_handler: DISCARD_VALUE
          master_item:
            key: elasticpro.gate.raw
          tags:
            - tag: component
              value: memory
        - uuid: a58b01ebcd804e6d809533e872821fc1
          name: 'Request gate: Memory: answers being read, %'
          type: DEPENDENT
          key: 'elasticpro.gate.memory[inflight.pused]'
          delay: '0'
          value_type: FLOAT
          units: '%'
          description: 'The share of the in-flight answer budget in use at the moment of the push.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.memory.inflight_pused'
              error_handler: DISCARD_VALUE
          master_item:
            key: elasticpro.gate.raw
          tags:
            - tag: component
              value: memory
          triggers:
            - uuid: e09e8cc71c244586a4e4a642c735f269
              expression: 'min(/ElasticPro request gate by Zabbix trapper/elasticpro.gate.memory[inflight.pused],{$ELASTICPRO.GATE.WINDOW})>{$ELASTICPRO.GATE.INFLIGHT.PUSED.WARN}'
              name: 'ElasticPro: in-flight answer memory nearly used up'
              opdata: 'In use: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: |
                For {$ELASTICPRO.GATE.WINDOW}, more than {$ELASTICPRO.GATE.INFLIGHT.PUSED.WARN}% of the memory ElasticPro may spend on answers being read at once was in use at every push. New large answers wait for room or are refused as too large. Raise CORE_MEM_LIMIT, or narrow the requests.
              tags:
                - tag: scope
                  value: capacity
      tags:
        - tag: class
          value: software
        - tag: target
          value: elasticpro
      macros:
        - macro: '{$ELASTICPRO.GATE.NODATA}'
          value: '5m'
          description: 'Alert when no figures have arrived for this long. The core pushes every 60 s and backs off to 10 min while pushes fail.'
        - macro: '{$ELASTICPRO.GATE.WINDOW}'
          value: '10m'
          description: 'How long a condition must hold (queueing, waits, memory) or how far back refusals are added up.'
        - macro: '{$ELASTICPRO.GATE.QUEUED.WARN}'
          value: '1'
          description: 'Warning: at least this many requests queued at every push in the window.'
        - macro: '{$ELASTICPRO.GATE.QUEUED.CRIT}'
          value: '20'
          description: 'Average: at least this many requests queued at every push in the window.'
        - macro: '{$ELASTICPRO.GATE.REFUSED.WARN}'
          value: '5'
          description: 'Warning: at least this many requests turned away in the window.'
        - macro: '{$ELASTICPRO.GATE.REFUSED.CRIT}'
          value: '50'
          description: 'Average: at least this many requests turned away in the window.'
        - macro: '{$ELASTICPRO.GATE.WAIT.P95.WARN}'
          value: '5'
          description: 'Warning: a person''s wait p95 above this many seconds for the whole window.'
        - macro: '{$ELASTICPRO.GATE.WAIT.P95.CRIT}'
          value: '15'
          description: 'Average: a person''s wait p95 above this many seconds for the whole window (ES_QUEUE_WAIT_MS is 20 s by default).'
        - macro: '{$ELASTICPRO.GATE.WAIT.SAMPLES}'
          value: '3'
          description: 'The wait triggers need at least this many minutes with requests in the window, so one slow minute alone does not fire them.'
        - macro: '{$ELASTICPRO.GATE.PAUSED.MAX}'
          value: '30m'
          description: 'Alert when every request has been paused for longer than this.'
        - macro: '{$ELASTICPRO.GATE.TOO_LARGE.WARN}'
          value: '10'
          description: 'Info: at least this many answers over the response cap in an hour.'
        - macro: '{$ELASTICPRO.GATE.INFLIGHT.PUSED.WARN}'
          value: '90'
          description: 'Warning: in-flight answer memory above this percentage for the whole window.'
      valuemaps:
        - uuid: 329f7f00047241f7804528d96f102746
          name: 'ElasticPro pause state'
          mappings:
            - value: '0'
              newvalue: 'Running'
            - value: '1'
              newvalue: 'Paused'
        - uuid: c21b02bc9b7c4789b489aa0c73400a13
          name: 'ElasticPro poller mode'
          mappings:
            - value: '0'
              newvalue: 'auto'
            - value: '1'
              newvalue: 'background'
            - value: '2'
              newvalue: 'hybrid'
            - value: '3'
              newvalue: 'on-demand'
            - value: '255'
              newvalue: 'unknown'
  triggers:
    - uuid: 2252ee96cefb41d795f2a6ac93706f06
      expression: 'min(/ElasticPro request gate by Zabbix trapper/elasticpro.gate.wait.p95[interactive],{$ELASTICPRO.GATE.WINDOW})>{$ELASTICPRO.GATE.WAIT.P95.CRIT} and count(/ElasticPro request gate by Zabbix trapper/elasticpro.gate.wait.p95[interactive],{$ELASTICPRO.GATE.WINDOW})>={$ELASTICPRO.GATE.WAIT.SAMPLES} and last(/ElasticPro request gate by Zabbix trapper/elasticpro.gate.granted[interactive])>0'
      name: 'ElasticPro: people wait too long for a request slot'
      opdata: 'Wait p95: {ITEM.LASTVALUE1}'
      priority: AVERAGE
      description: |
        The 95th percentile of how long a person's request waited for a slot stayed above {$ELASTICPRO.GATE.WAIT.P95.CRIT} s for {$ELASTICPRO.GATE.WINDOW} (at least {$ELASTICPRO.GATE.WAIT.SAMPLES} minutes with requests), and people are still asking. Close to ES_QUEUE_WAIT_MS, past which requests are refused.
        Minutes in which nobody asked for anything send no p95 and do not count; when nobody has asked in the last minute the problem resolves, because a wait cannot be measured without requests.
      tags:
        - tag: scope
          value: performance
    - uuid: af372c8462c64d08bc1929b54624b31e
      expression: 'min(/ElasticPro request gate by Zabbix trapper/elasticpro.gate.wait.p95[interactive],{$ELASTICPRO.GATE.WINDOW})>{$ELASTICPRO.GATE.WAIT.P95.WARN} and count(/ElasticPro request gate by Zabbix trapper/elasticpro.gate.wait.p95[interactive],{$ELASTICPRO.GATE.WINDOW})>={$ELASTICPRO.GATE.WAIT.SAMPLES} and last(/ElasticPro request gate by Zabbix trapper/elasticpro.gate.granted[interactive])>0'
      name: 'ElasticPro: people wait for a request slot'
      opdata: 'Wait p95: {ITEM.LASTVALUE1}'
      priority: WARNING
      description: |
        The 95th percentile wait of a person's request stayed above {$ELASTICPRO.GATE.WAIT.P95.WARN} s for {$ELASTICPRO.GATE.WINDOW}, and people are still asking.
      dependencies:
        - name: 'ElasticPro: people wait too long for a request slot'
          expression: 'min(/ElasticPro request gate by Zabbix trapper/elasticpro.gate.wait.p95[interactive],{$ELASTICPRO.GATE.WINDOW})>{$ELASTICPRO.GATE.WAIT.P95.CRIT} and count(/ElasticPro request gate by Zabbix trapper/elasticpro.gate.wait.p95[interactive],{$ELASTICPRO.GATE.WINDOW})>={$ELASTICPRO.GATE.WAIT.SAMPLES} and last(/ElasticPro request gate by Zabbix trapper/elasticpro.gate.granted[interactive])>0'
      tags:
        - tag: scope
          value: performance
