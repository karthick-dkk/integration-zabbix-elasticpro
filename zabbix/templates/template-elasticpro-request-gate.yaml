        - uuid: 2adac1e2f027485fab51133c995b1ee7
          name: 'Request gate: Memory: read cache budget'
          type: DEPENDENT
          key: 'elasticpro.gate.memory[readcache.budget]'
          delay: '0'
          units: 'B'
          description: 'The read cache''s budget (ES_READ_CACHE_MB, at most a sixteenth of CORE_MEM_LIMIT).'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.memory.read_cache_budget_bytes'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
